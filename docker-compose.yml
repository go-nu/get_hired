# 웹(Django)과 DB(PostgreSQL)를 함께 띄운다.
#   docker compose up --build
#   docker compose exec web python manage.py createsuperuser
# .env 의 SECRET_KEY, DB_NAME, DB_USER, DB_PASSWORD 를 그대로 쓴다.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db  # 컨테이너 안에서는 DB 가 localhost 가 아니라 db 서비스다
      DB_PORT: "5432"
      DEBUG: "True"  # 개발 서버가 정적 파일(CSS)을 내주려면 필요하다
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
