{% extends "base.html" %}

{% block title %}로그인 · 취업 활동 관리{% endblock %}

{% block content %}
<div class="mx-auto mt-16 max-w-sm rounded-lg border border-gray-200 bg-white p-6 shadow-sm">
    <h1 class="mb-6 text-xl font-semibold">로그인</h1>

    {% if form.errors %}
    <p class="mb-4 rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">아이디 또는 비밀번호가 올바르지 않습니다.</p>
    {% endif %}

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div>
            <label for="{{ form.username.id_for_label }}" class="mb-1 block text-sm font-medium">아이디</label>
            <input type="text" name="username" id="{{ form.username.id_for_label }}" autofocus required
                   class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <div>
            <label for="{{ form.password.id_for_label }}" class="mb-1 block text-sm font-medium">비밀번호</label>
            <input type="password" name="password" id="{{ form.password.id_for_label }}" required
                   class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
        </div>
        <button type="submit" class="w-full rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">로그인</button>
    </form>
</div>
{% endblock %}
