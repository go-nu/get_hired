{% extends "base.html" %}

{% block title %}기업 정보 수정 · 취업 활동 관리{% endblock %}

{% block content %}
<h1 class="mb-6 text-xl font-semibold">기업 정보 수정</h1>

<form method="post" class="max-w-2xl space-y-4 rounded-lg border border-gray-200 bg-white p-4">
    {% csrf_token %}
    {% for error in form.non_field_errors %}
    <p class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ error }}</p>
    {% endfor %}
    {% for field in form %}
    {% include "applications/_field.html" %}
    {% endfor %}

    <div class="flex items-center gap-3">
        <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">저장</button>
        <a href="{% url 'applications:company_list' %}" class="text-sm text-gray-600 hover:text-gray-900">취소</a>
    </div>
</form>
{% endblock %}
