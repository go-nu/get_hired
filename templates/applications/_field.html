<div class="{{ wrapper_class }}">
    <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium">{{ field.label }}{% if field.field.required %} <span class="text-red-500">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="mt-1 text-xs text-gray-500">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}
    <p class="mt-1 text-sm text-red-600">{{ error }}</p>
    {% endfor %}
</div>
